    <!-- Splash instantâneo: cobre o tempo de boot do WebView2 com a identidade -->
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #06030f; }
      body {
        display: flex; align-items: center; justify-content: center;
        font-family: Inter, system-ui, sans-serif;
        background-image:
          radial-gradient(ellipse 60% 45% at 8% -5%, rgba(124,58,237,0.25), transparent 60%),
          radial-gradient(ellipse 55% 40% at 100% 0%, rgba(192,38,211,0.18), transparent 55%);
      }
      .splash { display: flex; flex-direction: column; align-items: center; gap: 20px; animation: fadein .4s ease; }
      @keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
      .splash-logo {
        width: 92px; height: 92px;
        animation: floaty 2.4s ease-in-out infinite;
        filter: drop-shadow(0 0 22px rgba(139,92,246,.55));
      }
      @keyframes floaty {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-7px) scale(1.03); }
      }
      .splash-name { font-size: 26px; font-weight: 700; color: #fff; letter-spacing: -0.02em; line-height: 1.1; text-align: center; }
      .splash-name span {
        background: linear-gradient(90deg, #a78bfa 0%, #e879f9 60%, #c026d3 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .splash-bar-wrap { width: 210px; height: 3px; border-radius: 3px; background: #1e1740; overflow: hidden; }
      .splash-bar {
        height: 100%; width: 40%; border-radius: 3px;
        background: linear-gradient(90deg, #8b5cf6, #c026d3);
        animation: slide 1.15s ease-in-out infinite;
        box-shadow: 0 0 10px rgba(139,92,246,.7);
      }
      @keyframes slide {
        0% { margin-left: -40%; } 100% { margin-left: 100%; }
      }
      .splash-status { font-size: 11px; letter-spacing: .25em; text-transform: uppercase; color: #6b5a9e; }
    </style>
  </head>
